version = "0.2.0"
description = "Reality View 理解度证据分析与研究/试行计划维护（本地合成资料）"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
reality-view = "reality_view_comprehension.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
